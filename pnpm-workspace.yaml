packages:
  - "."

ignoredOptionalDependencies:
  - "@react-native-async-storage/async-storage"

# Patched releases under Meteora's SDKs (Anchor's client, web3.js v1) and the CSS build (docs/SECURITY.md).
# rpc-websockets stays at 9.3.3: later ones need uuid 14, which is ESM-only and does not
# load in web3.js v1 on Vercel. uuid 11.1.1 is the last patched line that loads with require().
overrides:
  bn.js: 5.2.5
  jayson: 5.0.0
  rpc-websockets: 9.3.3
  source-map-js: 1.2.2
  toml: 4.3.0
  uuid: 11.1.1

packageExtensions:
  "@solana-mobile/mobile-wallet-adapter-protocol@2.3.0":
    peerDependenciesMeta:
      react-native:
        optional: true
patchedDependencies:
  '@solana-mobile/mobile-wallet-adapter-protocol@2.3.0': patches/@solana-mobile__mobile-wallet-adapter-protocol@2.3.0.patch
  '@solana-mobile/wallet-standard-mobile@0.6.0': patches/@solana-mobile__wallet-standard-mobile@0.6.0.patch
  bigint-buffer@1.1.5: patches/bigint-buffer@1.1.5.patch
