packages:
  - "."

overrides:
  # Later ones need uuid 14, which is ESM-only and does not load in web3.js v1 on Vercel.
  rpc-websockets: 9.3.3
  # Patched releases under Meteora's SDKs, Anchor's client and web3.js v1 (docs/SECURITY.md).
  # uuid 11.1.1 is the last patched line that still loads with require().
  bn.js: 5.2.5
  jayson: 5.0.0
  toml: 4.3.0
  uuid: 11.1.1

ignoredOptionalDependencies:
  - "@react-native-async-storage/async-storage"

packageExtensions:
  "@solana-mobile/mobile-wallet-adapter-protocol@2.3.0":
    peerDependenciesMeta:
      react-native:
        optional: true
